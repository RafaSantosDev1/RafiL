@if (menu.isOpen()) {
  <div class="menu" role="dialog" aria-modal="true" [attr.aria-label]="i18n.dict().nav.openMenu">
    <div class="menu__head">
      <span class="menu__brand">Rafael Santos</span>
      <button
        type="button"
        class="menu__close"
        (click)="menu.closeMenu()"
        [attr.aria-label]="i18n.dict().nav.closeMenu"
      >
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <path d="M5 5l14 14M19 5L5 19" />
        </svg>
      </button>
    </div>

    <nav class="menu__nav" aria-label="Navegação principal / Primary navigation">
      <ul>
        @for (link of links(); track link.id) {
          <li>
            <a [href]="'#' + link.id" (click)="menu.closeMenu()">
              <span class="menu__num">{{ link.index }}</span>
              <span class="menu__label">{{ link.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="menu__foot">
      <app-language-toggle />
      <span class="menu__tagline">{{ i18n.dict().footer.tagline }}</span>
    </div>
  </div>
}
